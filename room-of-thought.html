ent 0 25%,#000 28% 63%,transparent 66%);mask:radial-gradient(circle,transparent 0 25%,#000 28% 63%,transparent 66%);pointer-events:none}.tape-roll.is-visible{display:grid}.tape-roll span{position:relative;z-index:1;width:37%;height:37%;border-radius:50%;background:#ede9dc}.drag-tape{left:0;top:0;width:0;opacity:0;transform-origin:0 50%}.drag-tape.is-dragging{opacity:1}.close-book{position:fixed;top:var(--safe-top);right:var(--safe-right);z-index:45;border-bottom-color:#f4f1e89e;color:#f8f6efd9}.page-controls{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:18px;transform:translate(-50%);color:#f8f6efd1}.page-controls button{border-bottom-color:#f4f1e880;color:inherit}.page-controls button:disabled{opacity:.3;cursor:default}#pageIndicator{min-width:80px;font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.08em;text-align:center}.empty-page-note{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);color:#35302842;font-family:Nanum Myeongjo,Batang,serif;font-size:clamp(14px,1.8vw,19px);letter-spacing:.14em;white-space:nowrap}.specimen-time{position:absolute;left:50%;top:calc(100% + 1px);transform:translate(-50%);color:#37322a63;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.04em;white-space:nowrap}.noscript-fallback{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:30px;background:#dedbd2;text-align:center}.noscript-static{position:fixed;inset:0;display:grid;place-items:center;padding:30px;background:#dedbd2;color:#181816;text-align:center}@media(max-width:680px){.book-shell{height:min(82vh,680px)}.diary-book{width:min(91vw,460px);height:min(81vh,680px)}.diary-book .book-seam{display:none}.diary-page{width:95.6%}#leftPage{left:2.2%}#rightPage{display:none}.mount-hint{bottom:calc(4% + 64px)}.pending-specimen,.saved-specimen{width:clamp(50px,16vw,76px)}.hint{font-size:13px}}@media(max-height:420px){.book-shell,.   </head>
  <body>
    <main id="app" aria-label="사유의 방 3D 전시">
      <p id="sceneHelp" class="sr-only">커다란 볼펜 끝은 드래그해 움직입니다. 키보드에서는 스페이스바로 맨홀을 휘젓고, M 키로 모기를 잡고, D 키로 다이어리를 엽니다.</p>
      <canvas id="scene" tabindex="0" aria-describedby="sceneHelp" aria-label="중앙 바닥에 실제로 뚫린 맨홀과 커다란 볼펜이 놓인 전시장"></canvas>

      <p id="hint" class="hint" role="status">볼펜 끝으로 맨홀을 휘저으세요</p>

      <nav class="scene-actions" aria-label="작품 도구">
        <button id="diaryButton" class="sr-only" type="button">다이어리 열기</button>
        <button id="soundButton" class="quiet-button sound-button" type="button" aria-pressed="false">소리</button>
      </nav>

      <section id="mountOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="다이어리에 기록하기" aria-hidden="true">
        <div class="book-shell mounting-book">
          <div class="book-seam" aria-hidden="true"></div>
          <div id="mountPage" class="paper mount-page" tabindex="0" aria-describedby="mountHint" aria-label="표본을 놓을 다이어리 페이지">
            <time id="mountDate" class="page-date"></time>
            <div id="mountExisting" class="mount-existing" aria-hidden="true"></div>
            <div id="pendingSpecimen" class="pending-specimen" aria-hidden="true"></div>
            <div id="tapeRoll" class="tape-roll" aria-label="스카치테이프" role="button" tabindex="0">
              <span></span>
            </div>
            <div id="dragTape" class="drag-tape" aria-hidden="true"></div>
            <p id="mountHint" class="mount-hint" role="status" aria-live="polite" aria-atomic="true">놓을 곳을 누르세요</p>
          </div>
        </div>
      </section>

      <section id="diaryOverlay" class="overlay diary-overlay" role="dialog" aria-modal="true" aria-label="다이어리" aria-hidden="true">
        <button id="closeDiary" class="close-book" type="button" aria-label="다이어리 덮기">방으로</button>
        <div class="book-shell diary-book">
          <div class="book-seam" aria-hidden="true"></div>
          <article id="leftPage" class="paper diary-page" aria-label="왼쪽 페이지"></article>
          <article id="rightPage" class="paper diary-page" aria-label="오른쪽 페이지"></article>
        </div>
        <div class="page-controls">
          <button id="prevPage" type="button" aria-label="이전 페이지">이전</button>
          <span id="pageIndicator"></span>
          <button id="nextPage" type="button" aria-label="다음 페이지">다음</button>
        </div>
      </section>

      <div id="noscriptFallback" class="noscript-fallback" hidden>
        이 작품을 보려면 WebGL과 JavaScript가 필요합니다.
      </div>
      <noscript><div class="noscript-static">이 작품을 보려면 JavaScript가 필요합니다.</div></noscript>
    </main>
  </body>
</html>
